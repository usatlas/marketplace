name: Check Skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: latest

      - name: Lint and verify README
        run: pixi run check-skills
