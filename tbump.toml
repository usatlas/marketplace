github_url = "https://github.com/usatlas/marketplace"

[version]
current = "0.2.2"

regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (rc
    (?P<candidate>\d+)
  )?
  '''

[git]
message_template = "chore: bump version 0.2.2 → {new_version}"
tag_template = "v{new_version}"

[[file]]
src = "tbump.toml"
search = "bump version {current_version} → "

[[file]]
src = "pixi.toml"
search = 'version = "{current_version}"'

[[field]]
name = "candidate"
default = ""

[[before_commit]]
name = "sync metadata.version into marketplace.json"
cmd = "python3 scripts/sync_marketplace_version.py --metadata {new_version}"
