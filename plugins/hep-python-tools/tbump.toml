github_url = "https://github.com/usatlas/marketplace"

[version]
current = "1.0.0"

regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (rc
    (?P<candidate>\d+)
  )?
  '''

[git]
message_template = "chore(hep-python-tools): bump version 1.0.0 → {new_version}"
tag_template = "hep-python-tools-v{new_version}"

[[file]]
src = "plugins/hep-python-tools/tbump.toml"
search = "bump version {current_version} → "

[[file]]
src = "plugins/hep-python-tools/.claude-plugin/plugin.json"
search = '"version": "{current_version}"'

[[file]]
src = "plugins/hep-python-tools/.cursor-plugin/plugin.json"
search = '"version": "{current_version}"'

[[field]]
name = "candidate"
default = ""
