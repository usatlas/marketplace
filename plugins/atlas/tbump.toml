github_url = "https://github.com/usatlas/marketplace"

[version]
current = "2.0.0"

regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (rc
    (?P<candidate>\d+)
  )?
  '''

[git]
message_template = "chore(atlas): bump version 2.0.0 → {new_version}"
tag_template = "atlas-v{new_version}"

[[file]]
src = "plugins/atlas/tbump.toml"
search = "bump version {current_version} → "

[[file]]
src = "plugins/atlas/.claude-plugin/plugin.json"
search = '"version": "{current_version}"'

[[file]]
src = "plugins/atlas/.cursor-plugin/plugin.json"
search = '"version": "{current_version}"'

[[field]]
name = "candidate"
default = ""
