github_url = "https://github.com/usatlas/marketplace"

[version]
current = "1.1.0"

regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (rc
    (?P<candidate>\d+)
  )?
  '''

[git]
message_template = "chore(af-uchicago): bump version 1.1.0 → {new_version}"
tag_template = "af-uchicago-v{new_version}"

[[file]]
src = "plugins/af-uchicago/tbump.toml"
search = "bump version {current_version} → "

[[file]]
src = "plugins/af-uchicago/.claude-plugin/plugin.json"
search = '"version": "{current_version}"'

[[file]]
src = "plugins/af-uchicago/.cursor-plugin/plugin.json"
search = '"version": "{current_version}"'

[[field]]
name = "candidate"
default = ""
